[package]
name = "personal-document-manager"
version = "0.1.0"
description = "Local-first personal document manager"
authors = ["Personal Document Manager"]
edition = "2021"

[lib]
name = "personal_document_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
lopdf = "0.45.0"
open = "5"
quick-xml = "0.42"
rusqlite = { version = "0.32", features = ["bundled-full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Data_Pdf",
    "Foundation",
    "Graphics_Imaging",
    "Storage_Streams",
    "Win32_System_WinRT",
] }

[dev-dependencies]
png = "0.17"
tempfile = "3"
